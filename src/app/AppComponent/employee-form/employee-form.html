<h3>Employee form:</h3>
    <form class="employee-form"[formGroup]="employeeForm" (ngSubmit)="onSubmit()">
        <label name="name">Name:</label>
        <input placeholder="Robert Johnson" FormControlName="name" name="name" required>
    
        <label name="email">Email:</label>
        <input placeholder="user@example.com" FormControlName="email" name="email" required>

        <label name="department">Department:</label>
        <input placeholder="IT" FormControlName="department" name="department" required>

        <label name="role">Role:</label>
        <input placeholder="Technician" FormControlName="role" name="role" required>

        <label name="status">Status:</label>
        <select name="status" FormControlName="status" required>
            <option value="Active" >Active</option>
            <option value="Inactive">Inactive</option>
            <option value="On Leave">On Leave</option>
        </select>
        <!--<button (click)="handleButtonEvent()" [disabled]="employeeForm.invalid">Submit</button>-->
        <app-button [buttonText]="buttonName" (buttonPressed)="handleButtonEvent()"></app-button>
        <!--<app-button buttonText="Cancel"></app-button>-->

    </form>
