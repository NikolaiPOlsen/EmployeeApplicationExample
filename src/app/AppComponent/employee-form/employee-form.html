<h3>Employee form:</h3>
    <form class="employee-form" #employeeForm="ngForm">
        <label name="name">Name:</label>
        <input placeholder="Robert Johnson" [(ngModel)]="employee.name" name="name" required>
    
        <label name="email">Email:</label>
        <input placeholder="user@example.com" [(ngModel)]="employee.email" name="email" required>

        <label name="department">Department:</label>
        <input placeholder="IT" [(ngModel)]="employee.department" name="department" required>

        <label name="role">Role:</label>
        <input placeholder="IT Technician" [(ngModel)]="employee.role" name="role" required>

        <label name="status">Status:</label>
        <select [(ngModel)]="employee.status" name="status" required>
            <option value="Active" >Active</option>
            <option value="Inactive">Inactive</option>
            <option value="On Leave">On Leave</option>
        </select>
        <!--<button (click)="handleButtonEvent()" [disabled]="employeeForm.invalid">Submit</button>-->
        <app-button [buttonText]="buttonName" (buttonPressed)="handleButtonEvent()"></app-button>
        <!--<app-button buttonText="Cancel"></app-button>-->

    </form>
