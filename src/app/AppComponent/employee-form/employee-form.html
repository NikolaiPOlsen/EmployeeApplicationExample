<h3>Employee form:</h3>
    <form class="employee-form" [formGroup]="employeeForm">
        <label name="name">Name:</label>
        <input placeholder="Robert Johnson" formControlName="name" name="name">
    
        <label name="email">Email:</label>
        <input placeholder="user@example.com" formControlName="email" name="email">

        <label name="department">Department:</label>
        <input placeholder="IT" formControlName="department" name="department">

        <label name="role">Role:</label>
        <input placeholder="Technician" formControlName="role" name="role">

        <label name="status">Status:</label>
        <select name="status" formControlName="status">
            <option value="Active" >Active</option>
            <option value="Inactive">Inactive</option>
            <option value="On Leave">On Leave</option>
        </select>
        <!--<button (click)="handleButtonEvent()" [disabled]="employeeForm.invalid">Submit</button>-->
        <app-button [buttonText]="buttonName" (buttonPressed)="handleButtonEvent()"></app-button>
        <!--<app-button buttonText="Cancel"></app-button>-->

    </form>
