<div class="card">
    <form class="form-container" [formGroup]="postForm">
        <label>Title: </label>
        <input placeholder="Title" formControlName="title">

        <label>Body: </label>
        <textarea placeholder="Body" formControlName="body"></textarea>
    </form>

    <app-button [buttonState]="postForm.invalid" [buttonText]="buttonText" (buttonPressed)="onSubmit()"></app-button>

</div>
