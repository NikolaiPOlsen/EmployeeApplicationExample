<div class="employee-card-container">
    <div class="card">
        <app-employee-form (getEmployeeList)="handleEmployeeList($event)" (cancelled)="employeeToUpdate = null" [employeeToEdit]="employeeToUpdate"></app-employee-form>
    </div>

    <div class="card">
        <app-employee-list [recieveEmployeeList]="listOfEmployee" (employeeSelectedForEdit)="employeeToUpdate = $event"></app-employee-list>
    </div>
</div>
